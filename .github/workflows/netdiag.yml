name: NetDiag

# 临时诊断 workflow：验证 GitHub Actions runner 到生产主机的网络可达性，
# 并在不泄露 secret 明文的前提下比对其指向。结论确定后删除本文件。
on:
  push:
    branches: [ "master" ]
    paths:
      - '.github/workflows/netdiag.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Runner egress IP
        run: echo "public_ip=$(curl -sS -m 10 https://ifconfig.me 2>/dev/null || echo n/a)"

      - name: TCP 22 by domain
        run: |
          if timeout 15 bash -c 'exec 3<>/dev/tcp/api.lvlvko.top/22' 2>/dev/null; then echo "tcp22_domain OK"; else echo "tcp22_domain FAIL"; fi

      - name: Secret shape (no plaintext)
        env:
          H: ${{ secrets.PRODUCTION_HOST }}
          U: ${{ secrets.PRODUCTION_USERNAME }}
        run: |
          echo "host_len=${#H}"
          echo "host_sha=$(printf %s "$H" | sha256sum | cut -c1-12)"
          echo "user_len=${#U}"

      - name: TCP 22 by secret host
        env:
          H: ${{ secrets.PRODUCTION_HOST }}
        run: |
          if [ -z "$H" ]; then echo "tcp22_secret EMPTY"; exit 0; fi
          if timeout 15 bash -c "exec 3<>/dev/tcp/$H/22" 2>/dev/null; then echo "tcp22_secret OK"; else echo "tcp22_secret FAIL"; fi

      - name: Resolve secret host
        env:
          H: ${{ secrets.PRODUCTION_HOST }}
        run: |
          ip=$(getent hosts "$H" 2>/dev/null | awk '{print $1}' | head -1)
          echo "resolved_ip_sha=$(printf %s "$ip" | sha256sum | cut -c1-12)"
          if [ "$ip" = "152.32.211.122" ]; then echo "resolved_is_prod YES"; else echo "resolved_is_prod NO"; fi

      - name: HTTP health
        run: curl -sS -m 15 -o /dev/null -w "http_code=%{http_code}\n" https://api.lvlvko.top/health || echo "http FAIL"
