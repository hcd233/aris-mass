name: NetDiag

# 临时诊断 workflow：验证 GitHub Actions runner 到生产主机的网络可达性。
# 结论确定后删除本文件。
on:
  push:
    branches: [ "master" ]
    paths:
      - '.github/workflows/netdiag.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Runner egress IP
        run: echo "public_ip=$(curl -sS -m 10 https://ifconfig.me 2>/dev/null || echo n/a)"

      - name: DNS resolve
        run: getent hosts api.lvlvko.top || echo "dns FAIL"

      - name: TCP 22
        run: |
          if timeout 15 bash -c 'exec 3<>/dev/tcp/api.lvlvko.top/22' 2>/dev/null; then echo "tcp22 OK"; else echo "tcp22 FAIL"; fi

      - name: TCP 443
        run: |
          if timeout 15 bash -c 'exec 3<>/dev/tcp/api.lvlvko.top/443' 2>/dev/null; then echo "tcp443 OK"; else echo "tcp443 FAIL"; fi

      - name: HTTP health
        run: curl -sS -m 15 -o /dev/null -w "http_code=%{http_code}\n" https://api.lvlvko.top/health || echo "http FAIL"

      - name: Traceroute to port 22
        run: |
          if command -v traceroute >/dev/null; then
            sudo timeout 90 traceroute -T -p 22 -n -m 18 api.lvlvko.top || echo "traceroute no output"
          else
            echo "traceroute unavailable"
          fi
